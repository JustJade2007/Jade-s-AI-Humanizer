name: Upload Python Package

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 1.2.1). Leave empty to use release tag or pyproject.toml'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-build:
    name: Build release distributions (jades-ai-humanizer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Clean build workspace
        run: |
          rm -rf dist/ build/ src/*.egg-info

      - name: Sync package version
        env:
          PACKAGE_VERSION: ${{ github.event.inputs.version }}
        run: |
          python packaging/sync_version.py

      - name: Build release distributions
        run: |
          python -m build

      - name: Verify build artifacts for jades-ai-humanizer
        run: |
          # Assert that jades_ai_humanizer files were generated
          ls -la dist/
          count=$(find dist/ -maxdepth 1 -type f -name 'jades_ai_humanizer-*' | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "ERROR: Expected at least 2 jades_ai_humanizer distributions, found $count"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: |
            dist/*.tar.gz
            dist/*.whl

  pypi-publish:
    name: Upload release to PyPI (jades-ai-humanizer)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jades-ai-humanizer
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing OIDC
    needs:
      - release-build

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Filter strictly to jades-ai-humanizer distributions
        run: |
          # Delete any file that is not an sdist (.tar.gz) or wheel (.whl) specifically for jades_ai_humanizer
          find dist/ -type f ! -name 'jades_ai_humanizer-*.tar.gz' ! -name 'jades_ai_humanizer-*.whl' -delete || true
          echo "Verified distributions queued for PyPI project 'jades-ai-humanizer':"
          ls -la dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
          attestations: false
          password: ${{ secrets.PYPI_API_TOKEN }}