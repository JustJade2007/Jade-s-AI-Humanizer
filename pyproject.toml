[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jades-ai-humanizer"
version = "1.2.0"
description = "Jade's AI Humanizer - Zero-Backend Client-Side Text Humanizer & REST Daemon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.1",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sse-starlette>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
humanizer = "humanizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
